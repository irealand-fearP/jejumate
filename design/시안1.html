<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제주메이트 시안1 · 현장형 로컬 피드</title><style>
:root{--bg:#f7f4ee;--surface:#fffdf8;--ink:#1f2a24;--muted:#66746c;--line:#e2d9ca;--sea:#167c80;--sea2:#e3f2f1;--orange:#ef6f3d;--orange2:#fff0e7;--green:#4f7d5b;--danger:#c94935}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--bg)}.hero{padding:18px;background:linear-gradient(180deg,#fff8ea,#f7f4ee)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:23px;font-weight:900}.weather{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;color:var(--sea);white-space:nowrap}.tagline{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.ask{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 20px rgba(82,63,37,.07)}.ask label{display:block;font-size:12px;font-weight:900;color:var(--orange);margin-bottom:8px}.ask-row{display:flex;gap:8px}.ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px}.ask button,.primary{border:0;border-radius:12px;background:var(--orange);color:#fff;padding:0 13px;font-weight:900;white-space:nowrap}.answer{display:none;margin-top:10px;padding:11px;border-radius:12px;background:var(--orange2);font-size:13px;line-height:1.5}.answer.show{display:block}.evidence{margin-top:8px;font-size:12px;color:#7b5542}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 18px}.quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;text-align:left;min-height:58px}.quick strong{display:block;font-size:13px}.quick span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 18px 10px}.tab{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800;color:var(--muted)}.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}.composer{margin:0 18px 12px;display:grid;grid-template-columns:1fr auto;gap:8px}.hint{border:1px dashed #d8b79f;background:#fff8f3;border-radius:14px;padding:10px 12px;font-size:12px;color:#7d5c4d}.feed{padding:0 18px 34px;display:flex;flex-direction:column;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px}.card.party{border-left:5px solid var(--orange)}.card.info{border-left:5px solid var(--sea)}.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.badge{font-size:11px;font-weight:900;border-radius:999px;padding:4px 8px}.party .kind{background:var(--orange2);color:#b34a23}.info .kind{background:var(--sea2);color:var(--sea)}.source{background:#f0ece4;color:#756b61}.readonly{margin-left:auto;background:#efe3d0;color:#8a6641}.content{margin:9px 0 0;font-size:14px;line-height:1.55}.status{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-top:11px;color:var(--muted);font-size:12px}.remain{font-weight:900;color:var(--danger)}.join{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:900}.detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}.card.open .detail{display:block}.actions{display:flex;gap:6px;margin-top:9px}.actions input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:8px}.actions button{border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:900;padding:8px 10px}@media(min-width:760px){.app{max-width:920px}.hero{padding:24px 28px}.brand{font-size:30px}.quick{grid-template-columns:repeat(6,1fr);margin-left:28px;margin-right:28px}.tabs{padding-left:28px;padding-right:28px}.composer{margin-left:28px;margin-right:28px}.feed{padding-left:28px;padding-right:28px;display:grid;grid-template-columns:repeat(2,1fr);align-items:start}.card:first-child{grid-column:span 2}}
</style></head><body><div class="app"><section class="hero"><div class="top"><div class="brand">제주메이트</div><div class="weather">맑음 28° · 바람 약함</div></div><p class="tagline">혼자 가긴 아쉬울 때, 지금 제주에 있는 사람과 바로 합류합니다.</p><form class="ask" id="ask"><label>카톡/게시글 기반으로 묻기</label><div class="ask-row"><input value="지금 함덕 가는 택시팟 있어?"><button>검색</button></div><div class="answer" id="answer">함덕 이동팟은 현재 1건이 가장 가깝습니다. 학교 앞 출발, 4명 중 3명 승인 상태라 1명만 더 받을 수 있습니다.<div class="evidence">근거: 말랑카멜 게시글 · 오늘 16:28 · 이동팟</div></div></form></section><section class="quick"><button><strong>지금 모집</strong><span>12분 내 마감</span></button><button><strong>내 주변</strong><span>함덕·애월 중심</span></button><button><strong>읽기전용 제외</strong><span>신청 가능한 글만</span></button></section><nav class="tabs" id="tabs"><button class="tab active" data-filter="all">전체</button><button class="tab" data-filter="party">파티</button><button class="tab" data-filter="info">정보</button><button class="tab" data-filter="ride">이동팟</button><button class="tab" data-filter="food">맛집</button><button class="tab" data-filter="cafe">카페</button></nav><section class="composer"><div class="hint">모집글은 신청/승인까지, 카톡 수집 글은 지난글이면 읽기전용으로 표시합니다.</div><button class="primary">파티 등록</button></section><main class="feed" id="feed"></main></div><script>
const posts=[{type:'party',cat:'ride',kind:'이동팟',src:'직접등록',txt:'함덕 가는 택시팟 구해요. 지금 학교 앞에서 출발합니다. 짐 많지 않으면 같이 타요.',time:'오늘 16:28',remain:'1명 남음',readonly:false},{type:'info',cat:'food',kind:'맛집',src:'카톡수집',txt:'협재 국수집 웨이팅은 있는데 고기국수 맛이 확실합니다. 점심 피크는 피해서 가는 편이 좋아요.',time:'오늘 14:02',remain:'정보글',readonly:false},{type:'party',cat:'run',kind:'러닝',src:'직접등록',txt:'저녁 8시에 삼다수숲길 러닝 같이 뛸 사람 구합니다. 페이스는 여유롭게, 초보 환영.',time:'오늘 13:40',remain:'4명 남음',readonly:false},{type:'party',cat:'ride',kind:'이동팟',src:'카톡수집',txt:'내일 아침 8시 함덕 가는 택시팟 구해요. 3명이서 나눠 타실 분 찾습니다.',time:'어제 08:00',remain:'지난글',readonly:true},{type:'info',cat:'cafe',kind:'카페',src:'카톡수집',txt:'이호테우 근처 노을 보기 좋은 카페. 창가 좌석은 6시 전에 잡는 게 안전합니다.',time:'오늘 10:20',remain:'정보글',readonly:false}];
function render(filter='all'){feed.innerHTML=posts.filter(p=>filter==='all'||p.type===filter||p.cat===filter).map(p=>`<article class="card ${p.type}"><div class="meta"><span class="badge kind">${p.kind}</span><span class="badge source">${p.src}</span>${p.readonly?'<span class="badge readonly">읽기전용</span>':''}</div><p class="content">${p.txt}</p><div class="status"><span>${p.time} · <b class="remain">${p.remain}</b></span>${p.type==='party'&&!p.readonly?'<button class="join">같이 갈래요</button>':''}</div><div class="detail">신청자 닉네임과 한 줄 메시지를 남기면 작성자가 관리 코드로 승인합니다.<div class="actions"><input placeholder="닉네임"><input placeholder="메시지"><button>신청</button></div></div></article>`).join('');document.querySelectorAll('.join').forEach(b=>b.onclick=e=>e.target.closest('.card').classList.toggle('open'))}render();tabs.onclick=e=>{if(!e.target.matches('.tab'))return;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.filter)};ask.onsubmit=e=>{e.preventDefault();answer.classList.add('show')};
</script></body></html>
