<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제주메이트 시안2 · 운영형 스캔 대시보드</title><style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#17202a;--muted:#687585;--line:#dfe5eb;--party:#d55c20;--party-bg:#fff0e8;--info:#1f6fb2;--info-bg:#eaf3ff;--ok:#0f8c69;--warn:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.shell{max-width:1120px;margin:0 auto;min-height:100vh}.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);padding:12px 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.brand{font-weight:900;font-size:18px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.bar button{border:0;background:#17202a;color:#fff;border-radius:8px;padding:9px 12px;font-weight:800}.layout{display:grid;grid-template-columns:280px 1fr;gap:14px;padding:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}.side{padding:14px;align-self:start;position:sticky;top:74px}.ask-title{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase}.ask input{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}.ask button{width:100%;margin-top:8px;border:0;background:#17202a;color:#fff;border-radius:8px;padding:10px;font-weight:800}.answer{display:none;margin-top:10px;background:#edf7f4;border-left:4px solid var(--ok);padding:10px;border-radius:8px;font-size:12px;line-height:1.5}.answer.show{display:block}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.metric{border:1px solid var(--line);border-radius:8px;padding:10px}.metric b{display:block;font-size:22px}.metric span{font-size:11px;color:var(--muted)}.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.filter{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;font-size:12px;font-weight:800;color:var(--muted)}.filter.active{background:#17202a;color:#fff;border-color:#17202a}.main{display:flex;flex-direction:column;gap:10px}.weather{padding:13px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.weather strong{font-size:14px}.weather span{font-size:12px;color:var(--muted)}.table{overflow:hidden}.head,.row{display:grid;grid-template-columns:92px 1fr 110px 86px 86px;gap:10px;align-items:center}.head{padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase}.row{padding:12px 14px;border-bottom:1px solid var(--line);background:#fff}.row:last-child{border-bottom:0}.type{border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;text-align:center}.party .type{background:var(--party-bg);color:var(--party)}.info .type{background:var(--info-bg);color:var(--info)}.title{font-size:14px;line-height:1.45}.meta{font-size:12px;color:var(--muted);margin-top:3px}.cap{font-weight:900}.cap.hot{color:var(--warn)}.status{font-size:12px;color:var(--muted)}.action{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 8px;font-weight:800}.party .action.primary{border-color:var(--party);background:var(--party);color:#fff}.drawer{display:none;background:#f8fafc;border-top:1px solid var(--line);padding:12px 14px;grid-column:1/-1;font-size:12px;color:var(--muted)}.row.open+.drawer{display:block}.applicants{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.applicants span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 8px}@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static}.head{display:none}.row{grid-template-columns:1fr auto;gap:8px}.type,.cap,.status{justify-self:start}.action{grid-column:2;grid-row:1/4}.drawer{grid-column:1/-1}.bar{grid-template-columns:1fr}.bar button{width:100%}}
</style></head><body><div class="shell"><header class="bar"><div><div class="brand">제주메이트 운영형</div><div class="sub">모집 현황, 읽기전용, 승인 대기 상태를 빠르게 스캔</div></div><button>파티 등록</button></header><main class="layout"><aside class="panel side"><form class="ask" id="ask"><div class="ask-title">RAG Quick Ask</div><input value="오늘 바로 신청 가능한 함덕 이동팟"><button>근거 포함 검색</button><div class="answer" id="answer">신청 가능한 함덕 이동팟 1건. 정원 4명 중 3명 승인, 마감까지 12분입니다.</div></form><section class="metrics"><div class="metric"><b>45</b><span>노출 글</span></div><div class="metric"><b>12</b><span>신청</span></div><div class="metric"><b>3</b><span>승인 대기</span></div><div class="metric"><b>4</b><span>지난글</span></div></section><nav class="filters" id="filters"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="party">파티</button><button class="filter" data-filter="info">정보</button><button class="filter" data-filter="readonly">지난글</button></nav></aside><section class="main"><div class="panel weather"><strong>제주 맑음 28° / 22°</strong><span>야외 동행 모집 노출 적합 · 자외선 높음</span></div><section class="panel table"><div class="head"><span>유형</span><span>내용</span><span>정원</span><span>상태</span><span></span></div><div id="rows"></div></section></section></main></div><script>
const rows=[{type:'party',kind:'이동팟',txt:'함덕 가는 택시팟 구해요. 지금 학교 앞 출발',src:'직접등록 · 오늘 16:28',cap:'3/4 · 1명 남음',hot:true,status:'신청 가능',readonly:false},{type:'info',kind:'맛집',txt:'협재 고기국수 웨이팅 있지만 추천. 점심 피크 회피',src:'카톡수집 · 오늘 14:02',cap:'정보글',status:'노출',readonly:false},{type:'party',kind:'러닝',txt:'저녁 8시 삼다수숲길 러닝. 초보 환영',src:'직접등록 · 오늘 13:40',cap:'1/5 · 4명 남음',status:'신청 가능',readonly:false},{type:'party',kind:'이동팟',txt:'내일 아침 8시 함덕 택시팟 3명 모집',src:'카톡수집 · 어제 08:00',cap:'지난글',status:'읽기전용',readonly:true},{type:'info',kind:'카페',txt:'이호테우 노을 카페. 창가 좌석은 6시 전 추천',src:'카톡수집 · 오늘 10:20',cap:'정보글',status:'노출',readonly:false}];
function draw(f='all'){rowsEl=document.getElementById('rows');rowsEl.innerHTML=rows.filter(r=>f==='all'||r.type===f||(f==='readonly'&&r.readonly)).map((r,i)=>`<div class="row ${r.type}" data-i="${i}"><span class="type">${r.kind}</span><div><div class="title">${r.txt}</div><div class="meta">${r.src}</div></div><span class="cap ${r.hot?'hot':''}">${r.cap}</span><span class="status">${r.status}</span><button class="action ${r.type==='party'&&!r.readonly?'primary':''}">${r.readonly?'보기':'관리'}</button></div><div class="drawer">승인 대기와 신청 메시지를 한 줄에서 확인합니다.<div class="applicants"><span>구름이 · 대기</span><span>바람돌이 · 승인</span><span>4차 승인 시 409 차단</span></div></div>`).join('');document.querySelectorAll('.row').forEach(r=>r.onclick=()=>r.classList.toggle('open'))}draw();filters.onclick=e=>{if(!e.target.matches('.filter'))return;document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');draw(e.target.dataset.filter)};ask.onsubmit=e=>{e.preventDefault();answer.classList.add('show')};
</script></body></html>
