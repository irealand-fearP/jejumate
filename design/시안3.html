<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제주메이트 시안3 · 발표형 쇼케이스</title><style>
:root{--bg:#101820;--panel:#17232d;--panel2:#20303c;--ink:#f5f1e8;--muted:#a9b6bf;--line:#2d4050;--sun:#ffb84d;--orange:#ff7a30;--mint:#2dd4bf;--blue:#5ab7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}.stage{min-height:100vh}.hero{min-height:58vh;padding:28px 20px 18px;display:grid;align-content:end;background:linear-gradient(180deg,rgba(16,24,32,.25),#101820 86%),url('https://images.unsplash.com/photo-1540202404-a2f29016b523?auto=format&fit=crop&w=1400&q=80') center/cover}.brand{font-size:42px;line-height:1;font-weight:950;letter-spacing:0;text-shadow:0 4px 18px rgba(0,0,0,.55)}.copy{max-width:540px;margin:12px 0 0;color:#fff4dc;font-size:16px;line-height:1.55;text-shadow:0 2px 10px rgba(0,0,0,.55)}.hero-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}.ask{background:rgba(23,35,45,.88);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px;backdrop-filter:blur(10px)}.ask-row{display:flex;gap:8px}.ask input{flex:1;min-width:0;border:1px solid var(--line);background:#0f171f;color:var(--ink);border-radius:10px;padding:11px;font-size:14px}.ask button{border:0;border-radius:10px;background:var(--sun);color:#201307;font-weight:950;padding:0 13px}.proof{display:none;margin-top:10px;color:#ffe1b0;font-size:13px;line-height:1.45}.proof.show{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:rgba(23,35,45,.88);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px}.stat b{display:block;font-size:24px;color:var(--mint)}.stat span{font-size:11px;color:var(--muted)}.content{max-width:1120px;margin:0 auto;padding:16px 16px 44px}.toolbar{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:9px 13px;font-weight:850}.chip.active{background:var(--ink);color:#101820}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{min-height:230px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}.cover{min-height:92px;padding:14px;background:linear-gradient(135deg,#62300f,var(--orange));display:flex;align-items:end}.info .cover{background:linear-gradient(135deg,#123c4a,#167c80)}.cover span{background:rgba(0,0,0,.35);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}.body{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}.txt{font-size:15px;line-height:1.5}.meta{font-size:12px;color:var(--muted)}.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}.remain{color:var(--sun);font-weight:950}.cta{border:0;background:var(--mint);color:#05231f;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:950}.readonly .cta{background:var(--panel2);color:var(--muted)}.demo-strip{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{border-left:3px solid var(--mint);padding-left:10px}.step b{display:block;font-size:13px}.step span{display:block;margin-top:4px;font-size:12px;color:var(--muted);line-height:1.4}@media(max-width:860px){.hero{min-height:54vh}.brand{font-size:34px}.grid{grid-template-columns:1fr}.demo-strip{grid-template-columns:1fr 1fr}}@media(min-width:900px){.hero{padding-left:calc((100vw - 1120px)/2 + 20px);padding-right:calc((100vw - 1120px)/2 + 20px)}.hero-grid{grid-template-columns:1.2fr .8fr;align-items:stretch}}
</style></head><body><div class="stage"><section class="hero"><div class="brand">제주메이트</div><p class="copy">카톡 속 흩어진 제주 동행 정보를 RAG로 묶고, 지금 신청 가능한 파티만 바로 행동으로 연결합니다.</p><div class="hero-grid"><form class="ask" id="ask"><div class="ask-row"><input value="지금 바로 합류 가능한 함덕 택시팟"><button>검색</button></div><div class="proof" id="proof">답변: 학교 앞 출발 이동팟 1건, 1명 남음. 근거 게시글과 모집 상태를 함께 노출합니다.</div></form><div class="stats"><div class="stat"><b>53</b><span>시드 데이터</span></div><div class="stat"><b>45</b><span>활성 피드</span></div><div class="stat"><b>409</b><span>정원 초과 차단</span></div></div></div></section><main class="content"><nav class="toolbar" id="toolbar"><button class="chip active" data-filter="all">전체</button><button class="chip" data-filter="party">파티</button><button class="chip" data-filter="info">로컬정보</button><button class="chip" data-filter="readonly">지난글</button></nav><section class="grid" id="grid"></section><section class="demo-strip"><div class="step"><b>1. 질문</b><span>카톡/게시글 근거 기반 답변</span></div><div class="step"><b>2. 신청</b><span>닉네임과 메시지로 합류 요청</span></div><div class="step"><b>3. 승인</b><span>작성자 코드로 승인/거절</span></div><div class="step"><b>4. 방어</b><span>정원 초과 승인 409 차단</span></div></section></main></div><script>
const cards=[{type:'party',kind:'이동팟',txt:'함덕 가는 택시팟. 지금 학교 앞 출발, 짐 적은 사람 환영.',meta:'직접등록 · 오늘 16:28',remain:'1명 남음',readonly:false},{type:'info',kind:'맛집',txt:'협재 고기국수는 웨이팅 있지만 만족도 높음. 점심 피크 회피 추천.',meta:'카톡수집 · 오늘 14:02',remain:'근거 노출',readonly:false},{type:'party',kind:'러닝',txt:'삼다수숲길 저녁 러닝. 초보도 가능한 느린 페이스.',meta:'직접등록 · 오늘 13:40',remain:'4명 남음',readonly:false},{type:'party readonly',kind:'지난 이동팟',txt:'내일 아침 8시 함덕 택시팟. 수집글은 지난글이면 읽기전용.',meta:'카톡수집 · 어제 08:00',remain:'읽기전용',readonly:true},{type:'info',kind:'카페',txt:'이호테우 노을 카페. 창가 좌석은 6시 전 확보가 안전.',meta:'카톡수집 · 오늘 10:20',remain:'로컬 팁',readonly:false}];
function paint(f='all'){grid.innerHTML=cards.filter(c=>f==='all'||c.type.includes(f)||(f==='readonly'&&c.readonly)).map(c=>`<article class="card ${c.type}"><div class="cover"><span>${c.kind}</span></div><div class="body"><div class="txt">${c.txt}</div><div class="meta">${c.meta}</div><div class="bottom"><span class="remain">${c.remain}</span><button class="cta">${c.readonly?'보기':'같이 갈래요'}</button></div></div></article>`).join('')}paint();toolbar.onclick=e=>{if(!e.target.matches('.chip'))return;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));e.target.classList.add('active');paint(e.target.dataset.filter)};ask.onsubmit=e=>{e.preventDefault();proof.classList.add('show')};
</script></body></html>
